name: xpgampp-stack

services:
  apache-php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: xpgampp-apache-php84
    restart: unless-stopped
    ports:
      - "${APACHE_HTTP_PORT:-8080}:80"
      - "${APACHE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./htdocs:/var/www/html
      - ./etc/php/php.ini:/usr/local/etc/php/conf.d/99-xpgampp.ini:ro
      - ./var/log:/var/log/apache2
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xampp_root_2026}
      MYSQL_DATABASE: xampp_shop
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: ${PG_PASSWORD:-xampp_pg_2026}
      PG_DATABASE: pg_analytics
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - xpgampp-net

  mysql:
    image: mysql:9.2
    container_name: xpgampp-mysql92
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xampp_root_2026}
      MYSQL_DATABASE: xampp_shop
      MYSQL_USER: xampp_user
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD:-xampp_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./etc/mysql/my.cnf:/etc/mysql/conf.d/xpgampp.cnf:ro
      - ./docker/init-mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xpgampp-net

  postgres:
    image: postgres:17-alpine
    container_name: xpgampp-postgres17
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-xampp_pg_2026}
      POSTGRES_DB: pg_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xpgampp-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: xpgampp-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 128M
    depends_on:
      - mysql
    networks:
      - xpgampp-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: xpgampp-pgadmin4
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8082}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@xpgampp.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-xampp_pg_2026}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      - postgres
    networks:
      - xpgampp-net

volumes:
  mysql_data:
  postgres_data:

networks:
  xpgampp-net:
    driver: bridge
