[global]
pid = /home/user/hosting/var/run/php-fpm.pid
error_log = /home/user/hosting/var/log/php_error.log
log_level = notice
daemonize = no

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 25
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
pm.status_path = /fpm-status
ping.path = /fpm-ping
catch_workers_output = yes
clear_env = no
