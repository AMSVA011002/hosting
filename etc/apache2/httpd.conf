# XPGAMPP Apache 2.4.63 Main Server Configuration
ServerRoot "/home/user/hosting"
Listen 0.0.0.0:8080
Listen 0.0.0.0:8443

ServerAdmin admin@localhost
ServerName localhost:8080
ServerTokens Prod
ServerSignature Off

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule headers_module modules/mod_headers.so

DocumentRoot "/home/user/hosting/htdocs"
<Directory "/home/user/hosting/htdocs">
    Options Indexes FollowSymLinks ExecCGI Includes
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

<FilesMatch \.php$>
    SetHandler "proxy:fcgi://127.0.0.1:9000"
</FilesMatch>

ErrorLog "/home/user/hosting/var/log/apache_error.log"
CustomLog "/home/user/hosting/var/log/apache_access.log" combined

Include etc/apache2/httpd-vhosts.conf
