# XPGAMPP Virtual Hosts Configuration (httpd-vhosts.conf)

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "/home/user/hosting/htdocs/dashboard"
    ErrorLog "/home/user/hosting/var/log/apache_error.log"
    CustomLog "/home/user/hosting/var/log/apache_access.log" combined
</VirtualHost>

<VirtualHost *:8080>
    ServerName shop.local
    ServerAlias www.shop.local
    DocumentRoot "/home/user/hosting/htdocs/shop-api"
    <Directory "/home/user/hosting/htdocs/shop-api">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8080>
    ServerName pg-explorer.local
    DocumentRoot "/home/user/hosting/htdocs/pg-explorer"
    <Directory "/home/user/hosting/htdocs/pg-explorer">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8080>
    ServerName mysql-bench.local
    DocumentRoot "/home/user/hosting/htdocs/mysql-bench"
    <Directory "/home/user/hosting/htdocs/mysql-bench">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
